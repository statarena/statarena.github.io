<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>STAT ARENA - เริ่มเกม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #2c3e50 0%, #0d1117 100%);
            font-family: 'Prompt', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-logo {
            width: 90%;
            max-width: 450px;
            max-height: 40vh;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.8));
            animation: float 4s ease-in-out infinite; 
            margin-bottom: 40px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .btn-start {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #f39c12, #d35400);
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
            padding: 15px 40px;
            min-width: 280px;
            height: 65px;
            border-radius: 50px;
            border: 3px solid #ffdb58;
            box-shadow: 0 8px 20px rgba(211, 84, 0, 0.5), inset 0 2px 2px rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .btn-start:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.5);
        }

        .btn-start.is-loading {
            background: linear-gradient(to bottom, #7f8c8d, #34495e);
            border-color: #95a5a6;
            box-shadow: none;
            pointer-events: none;
            transform: scale(0.98);
        }

        .mini-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 15px;
        }

        .btn-start.is-loading .mini-spinner {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ปุ่มคัดลอกลิงก์ (ช่วยแก้ปัญหา Chrome) */
        .copy-link-btn {
            margin-top: 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-link-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .copy-link-btn:active {
            transform: scale(0.95);
        }

        .notice {
            position: absolute;
            bottom: 25px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            width: 90%;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <img src="statarena-logo-official.png" alt="STAT ARENA" class="game-logo">

    <!-- ลิงก์ตรงไปหน้าเลือกบัญชี Google แบบ HTML บริสุทธิ์ -->
    <a href="https://accounts.google.com/AccountChooser?continue=https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec" 
       id="startGameBtn" 
       class="btn-start" 
       target="_top"
       onclick="handleButtonClick()">
        <span id="btnText">เข้าสู่สนามประลอง</span>
        <div class="mini-spinner" id="btnSpinner"></div>
    </a>

    <!-- ปุ่มคัดลอกลิงก์แก้ปัญหา Chrome มือถือ -->
    <button class="copy-link-btn" onclick="copyGameLink()">
        🔗 หากเข้าเกมไม่ได้ คลิกเพื่อคัดลอกลิงก์
    </button>

    <div class="notice">
        ระบบอาจให้คุณเลือกบัญชี Google ก่อนเข้าเกมเพื่อความเสถียร
    </div>

    <script>
        function handleButtonClick() {
            const btn = document.getElementById('startGameBtn');
            const text = document.getElementById('btnText');
            btn.classList.add('is-loading');
            text.innerText = 'กำลังตรวจสอบบัญชี...';
        }

        function copyGameLink() {
            // ลิงก์ตรงที่ใช้สำหรับคัดลอก
            const gameUrl = "https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec";
            
            // สร้างกล่องข้อความจำลองเพื่อคัดลอก
            const tempInput = document.createElement("input");
            tempInput.value = gameUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            
            // เปลี่ยนข้อความแจ้งเตือนผู้ใช้
            const copyBtn = document.querySelector('.copy-link-btn');
            copyBtn.innerText = "✅ คัดลอกแล้ว! นำไปวางในช่องค้นหาด้านบนได้เลย";
            copyBtn.style.color = "#4CAF50";
            copyBtn.style.borderColor = "#4CAF50";
            
            setTimeout(() => {
                copyBtn.innerText = "🔗 หากเข้าเกมไม่ได้ คลิกเพื่อคัดลอกลิงก์";
                copyBtn.style.color = "rgba(255, 255, 255, 0.7)";
                copyBtn.style.borderColor = "rgba(255, 255, 255, 0.3)";
            }, 5000);
        }
    </script>

</body>
</html>
