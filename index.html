<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>STAT ARENA - กำลังเข้าสู่เกม...</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #2c3e50 0%, #0d1117 100%);
            font-family: 'Prompt', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-logo {
            width: 90%;
            max-width: 450px;
            max-height: 40vh;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.8));
            animation: float 4s ease-in-out infinite; 
            margin-bottom: 40px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* ส่วนของ Loading Animation */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(189, 162, 107, 0.3);
            border-top: 5px solid #bda26b; /* สีทองแดง */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: #bda26b;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .notice {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- โลโก้เกม -->
    <img src="statarena-logo-official.png" alt="STAT ARENA" class="game-logo">

    <!-- สถานะกำลังโหลด -->
    <div class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">กำลังเข้าสู่สนามประลอง...</div>
    </div>

    <!-- ข้อความแจ้งเตือนด้านล่างสุด -->
    <div class="notice">
        ระบบจะนำคุณเข้าสู่เกมโดยอัตโนมัติ
    </div>

    <!-- สคริปต์สำหรับส่งต่อไปยังหน้าเว็บอัตโนมัติ -->
    <script>
        // เมื่อหน้าเว็บโหลดเสร็จ
        window.onload = function() {
            // หน่วงเวลาให้โชว์หน้า Loading 1.5 วินาที (1500 มิลลิวินาที) เพื่อความสวยงาม
            setTimeout(function() {
                // ส่งต่อไปยังลิงก์ Google Script ทันที (ใช้ window.top เพื่อป้องกันการถูกบล็อกใน Chrome)
                window.top.location.href = "https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec";
            }, 1500); 
        };
    </script>

</body>
</html>
