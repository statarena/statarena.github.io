<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAT ARENA - เริ่มเกม</title>
    <!-- นำเข้าฟอนต์ภาษาไทยจาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* สไตล์พื้นฐาน: ตั้งค่าให้เต็มจอ (Full Screen) */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* ป้องกันการเลื่อน */
        }
        
        body {
            font-family: 'Prompt', sans-serif;
            /* เปลี่ยนพื้นหลังเป็นภาพประกอบเต็มตา (Full-screen background illustration) */
            /* หากคุณมีภาพพื้นหลังแบบ Full-screen ให้เปลี่ยน path ที่นี่ */
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); /* เพิ่มเงาตัวอักษรเพื่อให้ชัดเจน */
        }

        /* ภาชนะบรรจุหลัก: ปรับให้ดูเป็นแผงควบคุมเกม */
        .container {
            background: rgba(0, 0, 0, 0.8); /* พื้นหลังดำโปร่งแสง */
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            border: 4px solid #bda26b; /* กรอบสีทองแดง/บรอนซ์ */
            text-align: center;
            max-width: 480px;
            width: 85%;
            transition: transform 0.3s ease;
        }

        /* สไตล์ของโลโก้: วางตรงกลางด้านบน */
        .game-logo {
            max-width: 100%;
            height: auto;
            margin-bottom: 35px;
            /* เพิ่มเงาเรืองแสงให้โลโก้เด่นขึ้น */
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
        }

        h1 {
            margin-top: 0;
            color: #bda26b; /* สีทองแดงเดียวกับกรอบ */
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            color: #d1d1d1; /* สีเทาอ่อน */
            margin-bottom: 40px;
            font-size: 18px;
            line-height: 1.6;
        }

        /* สไตล์ปุ่มเริ่มเกม: ปรับให้ดูเป็นปุ่มเกม (Game-style button) */
        .btn-start {
            display: inline-block;
            background: linear-gradient(45deg, #e67e22, #d35400); /* ไล่สีส้มทอง */
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 600;
            padding: 18px 60px;
            border-radius: 50px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 15px rgba(211, 84, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 3px solid #bda26b; /* กรอบทอง */
        }

        .btn-start:hover {
            background: linear-gradient(45deg, #f39c12, #e67e22); /* ส้มทองสว่างขึ้น */
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(211, 84, 0, 0.8);
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.6);
        }

        /* สไตล์กล่องข้อความแจ้งเตือน: บูรณาการให้ดูเป็นส่วนหนึ่งของฉาก */
        .notice {
            margin-top: 40px;
            padding: 20px;
            background: rgba(189, 162, 107, 0.15); /* ทองแดงโปร่งแสง */
            border-left: 5px solid #bda26b; /* สีทองแดง */
            border-radius: 6px;
            font-size: 14px;
            color: #bda26b;
            text-align: left;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ส่วนแสดงโลโก้: อ้างอิงไฟล์ชื่อ logo.png ที่อยู่ในโฟลเดอร์เดียวกัน -->
        <img src="logo.png" alt="STAT ARENA" class="game-logo">

        <h1>🎮 ยินดีต้อนรับ</h1>
        <p>คลิกที่ปุ่มด้านล่างเพื่อเข้าสู่ระบบ<br>และเริ่มต้นความสนุกได้เลย!</p>
        
        <!-- ลิงก์เดิมที่ใช้ AccountChooser สำหรับเริ่มเกม -->
        <a href="https://accounts.google.com/AccountChooser?continue=https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec" 
           class="btn-start" 
           target="_blank" 
           rel="noopener noreferrer">
            เริ่มเกม
        </a>

        <!-- กล่องแจ้งเตือนเดิม: ถูกปรับแต่งให้เข้ากับธีม -->
        <div class="notice">
            หากคุณล็อกอินไว้หลายอีเมล ระบบจะให้คุณเลือกบัญชี Google ก่อนเข้าเกม เพื่อป้องกันปัญหาการโหลดหน้าเว็บไม่สำเร็จ
        </div>
    </div>

</body>
</html>
