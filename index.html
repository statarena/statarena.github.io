<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - เริ่มเกม</title>
    <!-- นำเข้าฟอนต์ภาษาไทยจาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }
        .btn-start {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            padding: 15px 40px;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }
        .btn-start:hover {
            background-color: #45a049;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }
        .btn-start:active {
            transform: translateY(1px);
        }
        .notice {
            margin-top: 25px;
            padding: 15px;
            background-color: #fff8e1;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 13px;
            color: #856404;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 ยินดีต้อนรับ</h1>
        <p>คลิกที่ปุ่มด้านล่างเพื่อเข้าสู่ระบบ<br>และเริ่มต้นความสนุกได้เลย!</p>
        
        <!-- ลิงก์ที่ใช้ AccountChooser เพื่อแก้ปัญหาอีเมลซ้อน -->
        <a href="https://accounts.google.com/AccountChooser?continue=https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec" 
           class="btn-start" 
           target="_blank" 
           rel="noopener noreferrer">
           เริ่มเกม
        </a>

        <div class="notice">
            หากคุณล็อกอินไว้หลายอีเมล ระบบจะให้คุณเลือกบัญชี Google ก่อนเข้าเกม เพื่อป้องกันปัญหาการโหลดหน้าเว็บไม่สำเร็จ
        </div>
    </div>

</body>
</html>
