<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>STAT ARENA</title>
    <style>
        /* ล้างค่าขอบต่างๆ และให้หน้าเว็บเต็มจอ 100% */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh; /* ใช้ dvh เพื่อแก้ปัญหาจอมือถือ */
            overflow: hidden;
            background-color: #0d1117; /* สีดำธีมเกม */
        }

        /* ตั้งค่า iframe ให้กินพื้นที่เต็มหน้าจอ */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* หน้าจอโหลดบังหน้าเว็บไว้ก่อนระหว่างรอ Google Script ดึงข้อมูล */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2c3e50 0%, #0d1117 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .game-logo {
            width: 70vw;
            max-width: 300px;
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(189, 162, 107, 0.3);
            border-top: 4px solid #bda26b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- หน้าจอ Loading สวยๆ ตอนเปิดเข้ามา -->
    <div class="loading-screen" id="loadingScreen">
        <img src="statarena-logo-official.png" alt="STAT ARENA" class="game-logo">
        <div class="spinner"></div>
    </div>

    <!-- ฝัง Google Apps Script ลงในหน้านี้เลย (ใส่ลิงก์ที่สะอาดของคุณลงใน src) -->
    <iframe 
        class="game-frame" 
        src="https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec"
        onload="hideLoading()">
    </iframe>

    <script>
        // เมื่อ iframe โหลดหน้า Google Script เสร็จ ให้ซ่อนหน้า Loading
        function hideLoading() {
            setTimeout(() => {
                const loader = document.getElementById('loadingScreen');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }, 1000); // หน่วงเวลา 1 วินาทีให้โหลดภาพครบ
        }
    </script>

</body>
</html>
