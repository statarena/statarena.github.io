<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ตั้งค่าให้แสดงเต็มจอแบบแอปพลิเคชันบนมือถือ (Mobile Web App) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a252f">

    <title>STAT ARENA - เริ่มเกม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* แก้ไขให้รองรับการเลื่อนจอหากมือถือจอเล็ก และให้เต็มจอพอดี */
        html, body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            -webkit-tap-highlight-color: transparent; /* เอาไฮไลท์สีฟ้าตอนกดลิงก์ในมือถือออก */
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            border: 4px solid #bda26b;
            text-align: center;
            max-width: 480px;
            width: 85%;
            margin: 20px; /* เพิ่มขอบกันชนหน้าจอมือถือ */
        }

        .game-logo {
            max-width: 100%;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
        }

        h1 {
            margin-top: 0;
            color: #bda26b;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: #d1d1d1;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }

        .btn-start {
            display: inline-block;
            background: linear-gradient(45deg, #e67e22, #d35400);
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 600;
            padding: 15px 50px;
            border-radius: 50px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 15px rgba(211, 84, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 3px solid #bda26b;
            cursor: pointer;
            /* เพิ่มเพื่อให้กดติดง่ายขึ้นบนมือถือ */
            position: relative;
            z-index: 10;
        }

        .btn-start:hover {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(211, 84, 0, 0.8);
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.6);
        }

        .notice {
            margin-top: 30px;
            padding: 15px;
            background: rgba(189, 162, 107, 0.15);
            border-left: 5px solid #bda26b;
            border-radius: 6px;
            font-size: 13px;
            color: #bda26b;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- อย่าลืมนำไฟล์ statarena-logo-official.png อัปโหลดขึ้น GitHub ด้วย -->
        <img src="statarena-logo-official.png" alt="STAT ARENA" class="game-logo">

        <h1>🎮 ยินดีต้อนรับ</h1>
        <p>คลิกที่ปุ่มด้านล่างเพื่อเข้าสู่ระบบ<br>และเริ่มต้นความสนุกได้เลย!</p>
        
        <!-- แก้ไขลิงก์: เอา target="_blank" ออก เพื่อป้องกันเบราว์เซอร์มือถือบล็อกหน้าต่างใหม่ และให้เนียนเหมือนเล่นในแอป -->
        <a href="https://accounts.google.com/AccountChooser?continue=https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec" 
           class="btn-start">
            เริ่มเกม
        </a>

        <div class="notice">
            หากคุณล็อกอินไว้หลายอีเมล ระบบจะให้คุณเลือกบัญชี Google ก่อนเข้าเกม เพื่อป้องกันปัญหาการโหลดหน้าเว็บไม่สำเร็จ
        </div>
    </div>

</body>
</html>
