<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>STAT ARENA - เริ่มเกม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* เอาไฮไลท์สีฟ้าตอนกดปุ่มในมือถือออก */
        }

        /* ตั้งค่าหน้าจอให้เต็มขอบ 100% ไม่มีแถบเลื่อน */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh; /* บังคับให้สูงเต็มหน้าจอ */
            overflow: hidden;
            /* พื้นหลังธีมเกมเข้มๆ */
            background: radial-gradient(circle at center, #2c3e50 0%, #0d1117 100%);
            font-family: 'Prompt', sans-serif;
            color: white;
        }

        /* จัดเรียงเลย์เอาต์ให้กระจายตัวเต็มจอ */
        .game-screen {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; /* กระจายช่องว่างบน-กลาง-ล่างให้เท่ากัน */
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        /* ส่วนของโลโก้ */
        .logo-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .game-logo {
            width: 100%;
            max-width: 500px;
            max-height: 45vh; /* ให้โลโก้กินพื้นที่ไม่เกิน 45% ของความสูงจอ */
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.8));
            /* เพิ่มลูกเล่นขยับขึ้นลงเบาๆ เหมือนลอยได้ */
            animation: float 4s ease-in-out infinite; 
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* ส่วนข้อความและปุ่มกด */
        .action-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        h1 {
            color: #bda26b; /* สีทอง */
            font-size: 32px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            font-weight: 700;
        }

        p {
            color: #a8b2bd;
            font-size: 16px;
            margin: 0 0 30px 0;
        }

        /* ปุ่มกดขนาดใหญ่เต็มตา */
        .btn-start {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #f39c12, #d35400);
            color: white;
            text-decoration: none;
            font-size: 26px;
            font-weight: 700;
            padding: 15px 50px;
            min-width: 250px;
            border-radius: 50px;
            border: 3px solid #ffdb58;
            box-shadow: 0 8px 20px rgba(211, 84, 0, 0.5), inset 0 2px 2px rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.1s;
        }

        /* เอฟเฟกต์เวลากดปุ่ม */
        .btn-start:active {
            transform: scale(0.95); /* ปุ่มยุบลงเวลากด */
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.5);
        }

        /* ข้อความแจ้งเตือนด้านล่างสุด */
        .notice {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="game-screen">
        
        <!-- โลโก้เกมขยายเต็มจอ -->
        <div class="logo-section">
            <img src="statarena-logo-official.png" alt="STAT ARENA" class="game-logo">
        </div>

        <!-- ส่วนของปุ่มเข้าเกม -->
        <div class="action-section">
            <h1>เข้าสู่สนามประลอง</h1>
            <p>เตรียมตัวให้พร้อม แล้วเริ่มเกมได้เลย</p>
            
            <!-- ใช้ลิงก์ตรงของ Google Script เพื่อแก้ปัญหากดไม่ไปใน Chrome -->
            <a href="https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec" class="btn-start">
                เริ่มเกม
            </a>
        </div>
        
        <div class="notice">
            ระบบจะให้คุณลงชื่อเข้าใช้ด้วยบัญชี Google อัตโนมัติ
        </div>

    </div>

</body>
</html>
