<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>STAT ARENA - เริ่มเกม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #2c3e50 0%, #0d1117 100%);
            font-family: 'Prompt', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-logo {
            width: 90%;
            max-width: 450px;
            max-height: 40vh;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.8));
            animation: float 4s ease-in-out infinite; 
            margin-bottom: 50px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* ดีไซน์ปุ่มหลัก */
        .btn-start {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #f39c12, #d35400);
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
            padding: 15px 40px;
            min-width: 280px;
            height: 65px;
            border-radius: 50px;
            border: 3px solid #ffdb58;
            box-shadow: 0 8px 20px rgba(211, 84, 0, 0.5), inset 0 2px 2px rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .btn-start:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.5);
        }

        /* สถานะปุ่มตอนถูกกดแล้ว (Loading State) */
        .btn-start.is-loading {
            background: linear-gradient(to bottom, #7f8c8d, #34495e);
            border-color: #95a5a6;
            box-shadow: none;
            pointer-events: none; /* ป้องกันการกดเบิ้ล */
            transform: scale(0.98);
        }

        /* ไอคอนหมุนโหลดขนาดเล็กในปุ่ม */
        .mini-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 15px;
        }

        .btn-start.is-loading .mini-spinner {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notice {
            position: absolute;
            bottom: 25px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            width: 90%;
        }
    </style>
</head>
<body>

    <!-- โลโก้เกม -->
    <img src="logo2.png" alt="STAT ARENA" class="game-logo">

    <!-- ลิงก์ตรงแบบ HTML บริสุทธิ์ (ปลอดภัยจากการถูก Chrome บล็อกที่สุด) -->
    <!-- target="_top" บังคับให้โหลดหน้าเว็บทับกรอบความปลอดภัยทั้งหมด -->
    <a href="https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec" 
       id="startGameBtn" 
       class="btn-start" 
       target="_top"
       onclick="handleButtonClick()">
        <span id="btnText">เข้าสู่สนามประลอง</span>
        <div class="mini-spinner" id="btnSpinner"></div>
    </a>

    <!-- ข้อความแจ้งเตือน -->
    <div class="notice">
        ระบบจะให้คุณลงชื่อเข้าใช้ด้วยบัญชี Google ก่อนเข้าเกม
    </div>

    <script>
        // ฟังก์ชันนี้ทำหน้าที่แค่ "เปลี่ยนหน้าตาปุ่ม" ให้ผู้เล่นรู้ว่าโหลดอยู่
        // โดยไม่ไปขัดขวางการทำงานของแท็ก <a> ที่เบราว์เซอร์อนุญาต
        function handleButtonClick() {
            const btn = document.getElementById('startGameBtn');
            const text = document.getElementById('btnText');
            
            // เปลี่ยนรูปร่างปุ่มเป็นโหมดโหลด
            btn.classList.add('is-loading');
            text.innerText = 'กำลังเชื่อมต่อ...';
        }
    </script>

</body>
</html>
