<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>STAT ARENA - กำลังเข้าสู่เกม...</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #2c3e50 0%, #0d1117 100%);
            font-family: 'Prompt', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-logo {
            width: 90%;
            max-width: 450px;
            max-height: 35vh;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.8));
            animation: float 4s ease-in-out infinite; 
            margin-bottom: 30px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 120px; /* จองพื้นที่ไว้เพื่อไม่ให้หน้าจอกระตุกตอนปุ่มโผล่ */
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(189, 162, 107, 0.3);
            border-top: 5px solid #bda26b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: #bda26b;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* ----- สไตล์สำหรับปุ่มสำรอง (Fallback) ----- */
        .fallback-section {
            display: none; /* เริ่มต้นให้ซ่อนไว้ก่อน */
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fallback-message {
            color: #ff9999;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .btn-fallback {
            display: inline-block;
            background: linear-gradient(to bottom, #f39c12, #d35400);
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            padding: 12px 35px;
            border-radius: 50px;
            border: 2px solid #ffdb58;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.5);
            transition: transform 0.1s;
        }

        .btn-fallback:active {
            transform: scale(0.95);
        }

        .notice {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <img src="statarena-logo-official.png" alt="STAT ARENA" class="game-logo">

    <div class="loading-container" id="loadingArea">
        <div class="spinner" id="spinnerIcon"></div>
        <div class="loading-text" id="loadingStatus">กำลังเข้าสู่สนามประลอง...</div>
        
        <!-- ปุ่มสำรอง จะแสดงขึ้นมาเมื่อเบราว์เซอร์บล็อกสคริปต์อัตโนมัติ -->
        <div class="fallback-section" id="fallbackArea">
            <div class="fallback-message">เบราว์เซอร์ของคุณบล็อกการเข้าเกมอัตโนมัติ</div>
            <a href="https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec" target="_top" class="btn-fallback">
                คลิกที่นี่เพื่อเข้าเกมด้วยตัวเอง
            </a>
        </div>
    </div>

    <div class="notice">ระบบรักษาความปลอดภัยอาจให้คุณเลือกบัญชี Google ก่อนเข้าเล่น</div>

    <script>
        window.onload = function() {
            // ลิงก์ปลายทางของเกม
            const gameUrl = "https://script.google.com/macros/s/AKfycbx2Fs7qkyB-MhJycivrq-0QMNO8_T-5DqsztRnuQLIZuO5PgNAN6EB6_fI_5pc7mk_x/exec";
            
            // 1. ลองส่งต่ออัตโนมัติหลังจากโหลดภาพเสร็จ 1 วินาที
            setTimeout(function() {
                window.top.location.href = gameUrl;
            }, 1000); 

            // 2. แผนสำรอง: ถ้าผ่านไป 3.5 วินาทีแล้ว ผู้เล่นยังอยู่หน้าเดิม 
            // แปลว่า Chrome บล็อกคำสั่งด้านบน ให้แสดงปุ่มให้ผู้เล่นกดแทน
            setTimeout(function() {
                // ซ่อนไอคอนหมุนๆ
                document.getElementById('spinnerIcon').style.display = 'none';
                document.getElementById('loadingStatus').style.display = 'none';
                
                // แสดงปุ่มกดเข้าเกมด้วยตัวเอง
                document.getElementById('fallbackArea').style.display = 'block';
            }, 3500);
        };
    </script>

</body>
</html>
